site_name: Algorithm Journey Notes
site_description: C++ algorithm course outlines and study notes
site_url: "https://annajcy.github.io/algorithm-journey/"
repo_name: algorithm-journey
theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest
    - search.highlight
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
docs_dir: tutorial
site_dir: site
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
nav:
  - 首页: index.md
  - 课程规划:
      - 总览: plan/overview.md
      - 入门: plan/intro.md
      - 基础: plan/foundation.md
      - 扩展: plan/extension.md
      - 挺难: plan/hard.md
  - 正式讲义:
      - 入门:
          - Week 1:
              - 课程 01：算法学习框架与复杂度: notes/intro/week1/lesson1/content.md
  - 学习技巧:
      - LLM 时代如何更好地学习 Competitive Programming: tips/llm-for-competitive-programming.md
  - 写作规范:
      - 教程写作 SOP: writing_style/sop.md
